name: 'retailpulse'
version: '1.0.0'
profile: 'retailpulse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  start_date: '2024-01-01'
  env: "{{ target.name }}"

seeds:
  retailpulse:
    +schema: seeds

models:
  retailpulse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      core:
        +materialized: table
        +schema: marts
      reporting:
        +materialized: table
        +schema: reporting